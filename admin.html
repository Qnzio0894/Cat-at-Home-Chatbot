<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat at Home — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --linen: #f7f2ec;
        --parchment: #ede5d8;
        --warm-white: #fdfaf6;
        --clay: #a0624a;
        --rust: #c17b5a;
        --terracotta: #d4956a;
        --sage: #7a9e7e;
        --deep-sage: #4e7c55;
        --bark: #2e2018;
        --muted: #7a6a5a;
        --border: rgba(160, 98, 74, 0.15);
        --avail: #4e7c55;
        --unavail: #b84a4a;
        --partial: #c88040;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: var(--linen);
        color: var(--bark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1rem 3rem;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header-eyebrow {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--terracotta);
        margin-bottom: 0.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .header-eyebrow::before,
      .header-eyebrow::after {
        content: "";
        width: 24px;
        height: 1px;
        background: var(--terracotta);
        opacity: 0.5;
      }

      header h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 2.4rem;
        font-weight: 500;
        color: var(--bark);
        line-height: 1;
        margin-bottom: 6px;
      }
      header h1 em {
        font-style: italic;
        color: var(--clay);
      }
      header p {
        font-size: 13px;
        font-weight: 300;
        color: var(--muted);
      }

      .admin-layout {
        width: 100%;
        max-width: 900px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
      }

      .panel {
        background: var(--warm-white);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(46, 32, 24, 0.06);
      }

      .panel-header {
        padding: 1rem 1.25rem;
        background: var(--parchment);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .panel-title {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.1rem;
        font-weight: 500;
        color: var(--bark);
      }

      .cal-nav {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 14px;
        color: var(--clay);
        cursor: pointer;
        transition: background 0.2s;
      }
      .cal-nav:hover {
        background: var(--parchment);
      }

      .cal-grid {
        padding: 1rem;
      }

      .cal-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin-bottom: 6px;
      }
      .cal-weekday {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        text-align: center;
        color: var(--muted);
        padding: 4px 0;
      }

      .cal-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }

      .cal-day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
        position: relative;
      }
      .cal-day:hover {
        transform: scale(1.08);
      }
      .cal-day.empty {
        cursor: default;
      }
      .cal-day.past {
        color: rgba(122, 106, 90, 0.3);
        cursor: default;
      }

      .cal-day.disponible {
        background: rgba(78, 124, 85, 0.1);
        color: var(--avail);
        border: 1px solid rgba(78, 124, 85, 0.25);
      }
      .cal-day.parcial {
        background: rgba(200, 128, 64, 0.1);
        color: var(--partial);
        border: 1px solid rgba(200, 128, 64, 0.25);
      }
      .cal-day.lleno {
        background: rgba(184, 74, 74, 0.08);
        color: var(--unavail);
        border: 1px solid rgba(184, 74, 74, 0.2);
      }
      .cal-day.bloqueado {
        background: rgba(46, 32, 24, 0.08);
        color: var(--bark);
        border: 1px solid rgba(46, 32, 24, 0.2);
        text-decoration: line-through;
        opacity: 0.5;
      }
      .cal-day.today {
        box-shadow: 0 0 0 2px var(--clay);
        font-weight: 700;
      }

      .cal-legend {
        display: flex;
        gap: 10px;
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
        font-family: "DM Mono", monospace;
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot-avail {
        background: var(--avail);
      }
      .dot-partial {
        background: var(--partial);
      }
      .dot-full {
        background: var(--unavail);
      }
      .dot-blocked {
        background: var(--bark);
        opacity: 0.4;
      }

      .cal-hint {
        padding: 0.5rem 1rem 0.75rem;
        font-size: 11px;
        color: var(--muted);
        font-family: "DM Mono", monospace;
        letter-spacing: 0.03em;
        text-align: center;
      }

      /* ── RESERVAS ── */
      .reservas-list {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 460px;
        overflow-y: auto;
      }

      .reserva-card {
        background: var(--linen);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        border-left: 3px solid var(--terracotta);
      }

      .reserva-fecha {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        color: var(--clay);
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }

      .reserva-nombre {
        font-family: "Cormorant Garamond", serif;
        font-size: 1rem;
        font-weight: 500;
        color: var(--bark);
        margin-bottom: 2px;
      }

      .reserva-detalle {
        font-size: 12px;
        color: var(--muted);
        font-weight: 300;
      }

      .empty-state {
        text-align: center;
        padding: 2rem;
        color: var(--muted);
        font-size: 13px;
        font-weight: 300;
      }

      .btn-refresh {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--clay);
        cursor: pointer;
        letter-spacing: 0.04em;
      }
      .btn-refresh:hover {
        background: var(--parchment);
      }

      .footer-note {
        margin-top: 1.25rem;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        color: rgba(122, 106, 90, 0.5);
        letter-spacing: 0.08em;
      }

      @media (max-width: 700px) {
        .admin-layout {
          grid-template-columns: 1fr;
        }
        header h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-eyebrow">Panel de administración</div>
      <h1>Cat at <em>Home</em></h1>
      <p>Gestioná tu disponibilidad y reservas</p>
    </header>

    <div class="admin-layout">
      <!-- CALENDARIO ADMIN -->
      <div class="panel">
        <div class="panel-header">
          <button class="cal-nav" onclick="cambiarMes(-1)">‹</button>
          <span class="panel-title" id="cal-title"></span>
          <button class="cal-nav" onclick="cambiarMes(1)">›</button>
        </div>
        <div class="cal-grid">
          <div class="cal-weekdays">
            <div class="cal-weekday">Lu</div>
            <div class="cal-weekday">Ma</div>
            <div class="cal-weekday">Mi</div>
            <div class="cal-weekday">Ju</div>
            <div class="cal-weekday">Vi</div>
            <div class="cal-weekday">Sá</div>
            <div class="cal-weekday">Do</div>
          </div>
          <div class="cal-days" id="cal-days"></div>
        </div>
        <div class="cal-legend">
          <div class="legend-item">
            <div class="legend-dot dot-avail"></div>
            Disponible
          </div>
          <div class="legend-item">
            <div class="legend-dot dot-partial"></div>
            Último lugar
          </div>
          <div class="legend-item">
            <div class="legend-dot dot-full"></div>
            Lleno
          </div>
          <div class="legend-item">
            <div class="legend-dot dot-blocked"></div>
            Bloqueado
          </div>
        </div>
        <div class="cal-hint">Tocá un día para bloquearlo o desbloquearlo</div>
      </div>

      <!-- RESERVAS -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Reservas recibidas</span>
          <button class="btn-refresh" onclick="cargarReservas()">
            ↻ actualizar
          </button>
        </div>
        <div class="reservas-list" id="reservas-list">
          <div class="empty-state">Cargando reservas...</div>
        </div>
      </div>
    </div>

    <p class="footer-note">Cat at Home · Admin · Solo para uso interno</p>

    <script>
      const meses = [
        "Enero",
        "Febrero",
        "Marzo",
        "Abril",
        "Mayo",
        "Junio",
        "Julio",
        "Agosto",
        "Septiembre",
        "Octubre",
        "Noviembre",
        "Diciembre",
      ];
      let hoy = new Date();
      let año = hoy.getFullYear();
      let mes = hoy.getMonth() + 1;

      async function renderCalendario() {
        const title = document.getElementById("cal-title");
        const grid = document.getElementById("cal-days");
        title.textContent = `${meses[mes - 1]} ${año}`;
        grid.innerHTML = "";

        const res = await fetch(`/disponibilidad?año=${año}&mes=${mes}`);
        const data = await res.json();

        const primerDia = new Date(año, mes - 1, 1).getDay();
        const offset = primerDia === 0 ? 6 : primerDia - 1;

        for (let i = 0; i < offset; i++) {
          const empty = document.createElement("div");
          empty.classList.add("cal-day", "empty");
          grid.appendChild(empty);
        }

        const diasEnMes = new Date(año, mes, 0).getDate();
        for (let d = 1; d <= diasEnMes; d++) {
          const fechaStr = `${año}-${String(mes).padStart(2, "0")}-${String(
            d
          ).padStart(2, "0")}`;
          const estado = data[fechaStr] || "disponible";
          const fechaObj = new Date(año, mes - 1, d);

          const div = document.createElement("div");
          div.classList.add("cal-day");
          div.textContent = d;

          if (
            fechaObj < hoy &&
            fechaObj.toDateString() !== hoy.toDateString()
          ) {
            div.classList.add("past");
          } else {
            div.classList.add(estado);
            if (fechaObj.toDateString() === hoy.toDateString())
              div.classList.add("today");

            div.onclick = async () => {
              if (estado === "bloqueado") {
                await fetch("/desbloquear", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ fecha: fechaStr }),
                });
              } else {
                await fetch("/bloquear", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ fecha: fechaStr }),
                });
              }
              renderCalendario();
            };
          }

          grid.appendChild(div);
        }
      }

      function cambiarMes(delta) {
        mes += delta;
        if (mes > 12) {
          mes = 1;
          año++;
        }
        if (mes < 1) {
          mes = 12;
          año--;
        }
        renderCalendario();
      }

      async function cargarReservas() {
        const list = document.getElementById("reservas-list");
        const res = await fetch("/reservas");
        const data = await res.json();

        if (data.length === 0) {
          list.innerHTML =
            '<div class="empty-state">No hay reservas todavía.</div>';
          return;
        }

        list.innerHTML = "";
        data.sort((a, b) => (a.fecha > b.fecha ? 1 : -1));
        data.forEach((r) => {
          const card = document.createElement("div");
          card.classList.add("reserva-card");
          card.innerHTML = `
          <div class="reserva-fecha">${r.fecha || "Sin fecha"}</div>
          <div class="reserva-nombre">${r.nombre || "Sin nombre"}</div>
          <div class="reserva-detalle">${r.gato ? "🐱 " + r.gato : ""} ${
            r.direccion ? "· " + r.direccion : ""
          }</div>
        `;
          list.appendChild(card);
        });
      }

      renderCalendario();
      cargarReservas();
    </script>
  </body>
</html>
